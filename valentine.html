<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>

    <!--For styles -->
    <style>

    body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #fff;
    font-family: 'Arial', sans-serif;
    flex-direction: column;
  }
  
  .container {
    text-align: center;
  }
  
  h1 {
    font-size: 2.5em;
    color: #cf2d2d;
  }
  
  .buttons {
    margin-top: 20px;
  }
  
  .yes-button {
    font-size: 1.5em;
    padding: 10px 20px;
    margin-right: 10px;
    background-color: #38883b;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  .yes-button:hover {
    color: black;
  }
  
  .no-button {
    font-size: 1.5em;
    padding: 10px 20px;
    background-color: #cf2d2d;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  .no-button:hover {
    color: black;
  }
  
  .gif_container img {
    max-width: 100%;
    height: auto;
    border-radius: 10px;
    margin-top: 20px;
  }

    </style>

</head>

<body>

    <div class="container">

        <!-- For title -->
        <h1>Will you be my Valentine?</h1>

        <div class="buttons">
            <button class="yes-button" onclick="handleYesClick()">Yes</button>
            <button class="no-button" onclick="handleNoClick()">No</button>
        </div>

        <!-- For gif -->
        <div class="gif_container">
            <!-- <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExbW5lenZyZHI5OXM2eW95b3pmMG40cWVrMDhtNjVuM3A4dGNxa2g2dSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/VM1fcpu2bKs1e2Kdbj/giphy.gif" alt="Cute GIF"> -->
            <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExdnAwZHp6N3hwcG02ejh3bThscmUwOGFxczBrZ3drMnQzM2M5d3U2biZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/d8R5HipWkYcNJAnGX9/giphy.gif" alt="Cute GIF">
        </div>
    </div>


    <script>
const messages = [
    "Are you sure?",
    "Really sure??",
    "Are you positive?",
    "Pookie please...",
    "Just think about it!",
    "If you say no, I will be really sad...",
    "I will be very sad...",
    "I will be very very very sad...",
    "Ok fine, I will stop asking...",
    "Just kidding, say yes please! ❤️"
];

let messageIndex = 0;

function handleNoClick() {
    const noButton = document.querySelector('.no-button');
    const yesButton = document.querySelector('.yes-button');
    noButton.textContent = messages[messageIndex];
    messageIndex = (messageIndex + 1) % messages.length;
    const currentSize = parseFloat(window.getComputedStyle(yesButton).fontSize);
    yesButton.style.fontSize = `${currentSize * 1.5}px`;
}

function handleYesClick() {
    window.location.href = "accept.html";
}

    </script>

</body>
</html>
